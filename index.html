const LP_RGB_DIM       = [4, 4, 4];       // idle backlight, regular notes — barely lit
const LP_RGB_DIM_WHITE = [28, 28, 28];    // idle backlight, black/sharp notes (fretboard layout) —
                                           // kept well below LP_RGB_ACTIVE so pressed vs idle stays obvious
const LP_RGB_C_BLUE    = [10, 60, 127];   // idle backlight, every C (fretboard layout)
const LP_RGB_APP_ACTIVE = [127, 10, 10];  // note highlighted BY THE APP (mic, on-screen key, chroma test —
                                           // anything other than physically pressing the pad itself) — always red
const LP_RGB_APP_OCTAVE = [110, 10, 127]; // Settings > "full range detection" — the one pad matching the
                                           // exact detected octave, layered on top of the all-octaves red

/* app-triggered red isn't a plain on/off — it snaps to full brightness the
   moment a note is detected and *stays* there for as long as the note is
   still recognized as playing, then fades out over time using the exact
   same per-second decay rate (decayPct / applyDecayTick) as the bar chart
   once it actually stops — a pad's red glow behaves just like that note's
   bar. 0 = fully faded (idle backlight color), 1 = just triggered. */
const lpNoteBrightness = {};
const lpNotePlaying    = {}; // noteIdx -> true while still held (decay is paused)

/* Settings > Launchpad Behavior — when on, the exact octave of the last
   detected/played note also gets its own pad lit purple, on top of the
   usual all-octaves red highlight. lpNoteOctave keeps the last-known exact
   octave per chroma so the purple pad fades in step with the red one. */
let lpFullRangeDetection = true;
const lpNoteOctave = {};

function lpBlendColor(idle, active, t) {
  return idle.map((c, i) => Math.round(c + (active[i] - c) * t));
}

/* find the pad(s) that currently produce this exact (noteIdx, octave) pair in
   the active layout — mirrors the forward pad->note transform used by the
   INPUT layer (onLaunchpadPadMessage), so the highlighted pad always matches
   whatever transpose/octave-shift is currently applied. */
function lpPadsForNoteOctave(targetNoteIdx, targetOctave) {
  const pads = [];
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const pad  = 11 + col + 10 * row;
      const info = lpPadToNote(pad);
      if (!info) continue;
      let noteIdx    = info.noteIdx + lpTranspose;
      const octave   = info.octave + lpOctaveShift + Math.floor(noteIdx / 12);
      noteIdx        = ((noteIdx % 12) + 12) % 12;
      if (noteIdx === targetNoteIdx && octave === targetOctave) pads.push(pad);
    }
  }
  return pads;
}

function paintLaunchpadNoteFade(noteIdx) {
  if (!midiOut || !launchpadProgrammerMode) return;
  // the pads lit here are found by their own fixed (pre-transpose) identity —
  // the idle color to fade back toward must use that same identity, not the
  // currently-sounding noteIdx, or the pad's idle color gets permanently
  // stuck as the wrong note's shade once transpose is anything but 0
  const baseIdx = ((noteIdx - lpTranspose) % 12 + 12) % 12;
  const t = lpNoteBrightness[noteIdx] || 0;
  const [r, g, b] = lpBlendColor(lpBacklightColorForNote(baseIdx), LP_RGB_APP_ACTIVE, t);
  allPadsForIndex(noteIdx).forEach(pad => setLaunchpadRGB(midiOut, pad, r, g, b));
  if (lpFullRangeDetection && lpNoteOctave[noteIdx] !== undefined) {
    const [pr, pg, pb] = lpBlendColor(lpBacklightColorForNote(baseIdx), LP_RGB_APP_OCTAVE, t);
    lpPadsForNoteOctave(noteIdx, lpNoteOctave[noteIdx]).forEach(pad => setLaunchpadRGB(midiOut, pad, pr, pg, pb));
  }
}

/* move a color toward white by `amount` (0-1) — used so a pad with its own
   hue (like C's blue) lights up brighter *in the same hue* when pressed,
   instead of jumping to a plain white that erases which note it was */
function lightenColor([r, g, b], amount) {
  const lift = c => Math.round(c + (127 - c) * amount);
  return [lift(r), lift(g), lift(b)];
}

/* top-row round buttons — not part of the 8x8 grid, so Programmer Mode
   addresses and lights them via Control Change instead of Note On/Off.
   Left to right: Up, Down, Left, Right, Session, Drums, Keys, User. */
const LP_CC_UP      = 91;
const LP_CC_DOWN    = 92;
const LP_CC_LEFT    = 93;
const LP_CC_RIGHT   = 94;
const LP_CC_KEYS    = 97; // picks the piano layout
const LP_CC_USER    = 98; // picks the fretboard layout
const LP_CC_STOP_SOLO_MUTE = [19]; // side-column row 1 (bottom) — resets the bars, same as the app title

/* the rest of the side column, rows 2 (bottom) to 8 (top) — one button per
   waveform, red on whichever is currently selected, dimmed dark blue on the
   rest. Row order (bottom to top) matches LP_WAVE_ORDER's own order. */
const LP_WAVE_ORDER = ['sine', 'square', 'sawtooth', 'revsaw', 'pulse25', 'pulse12', 'organ'];
const LP_CC_WAVE = [29, 39, 49, 59, 69, 79, 89];
const LP_RGB_WAVE_DIM = [4, 4, 40]; // dark blue — idle waveform button

function paintLaunchpadWaveButtons(output) {
  LP_CC_WAVE.forEach((cc, i) => {
    const isSelected = LP_WAVE_ORDER[i] === waveType;
    const [r, g, b] = isSelected ? LP_RGB_APP_ACTIVE : LP_RGB_WAVE_DIM;
    setLaunchpadRGB(output, cc, r, g, b);
  });
  LP_CC_STOP_SOLO_MUTE.forEach(cc => setLaunchpadRGB(output, cc, ...LP_RGB_APP_OCTAVE)); // reset button — purple
}

function setWaveType(type) {
  waveType = type;
  const sel = document.getElementById('wave-select');
  if (sel) sel.value = type;
  if (midiOut && launchpadProgrammerMode) paintLaunchpadWaveButtons(midiOut);
}
let lpLayout = 'piano'; // 'piano' | 'fretboard'
let lpLightPressedPads = false; // Settings > Press states — physically pressing a pad lights it
let midiMonitorEnabled = true; // Settings > MIDI monitor in console — log incoming MIDI + outgoing LED commands
let midiInChannel  = 'omni'; // Settings > MIDI in channel — 'omni' or 0-15
let midiOutChannel = 0;      // Settings > MIDI out channel — 0-15 ('omni' falls back to channel 1 on send)

/* Up/Down shift the fixed octave-1..4 window the grid's INPUT layer plays at;
   Left/Right transpose which note-class each pad plays, both directions —
   independent of the OCT dial (which only affects the on-screen app itself). */
let lpOctaveShift = 0;
let lpTranspose   = 0;
const LP_OCTAVE_SHIFT_MIN = -2;
const LP_OCTAVE_SHIFT_MAX = 4;
const LP_TRANSPOSE_MIN = -6;
const LP_TRANSPOSE_MAX = 6;

/* noteIdx -> position(s) within one 2-row octave band. C gets a second, duplicated
   pad at the far end of the white-key row (col 7) so each row visually bookends
   itself with the tonic at both ends, matching the reference hardware layout,
   instead of leaving that last column dark. */
const LP_NOTE_PAD = [
  [{ row: 0, col: 0 }, { row: 0, col: 7 }], // C (+ duplicate for row continuity)
  [{ row: 1, col: 1 }], // C#
  [{ row: 0, col: 1 }], // D
  [{ row: 1, col: 2 }], // D#
  [{ row: 0, col: 2 }], // E
  [{ row: 0, col: 3 }], // F
  [{ row: 1, col: 4 }], // F#
  [{ row: 0, col: 4 }], // G
  [{ row: 1, col: 5 }], // G#
  [{ row: 0, col: 5 }], // A
  [{ row: 1, col: 6 }], // A#
  [{ row: 0, col: 6 }], // B
];

function padNotesForIndex(noteIdx, band) {
  return LP_NOTE_PAD[noteIdx].map(({ row, col }) => 11 + col + 10 * (band * 2 + row));
}

/* reverse lookup for the INPUT layer — pressing a physical pad reports its own
   grid note number back to us; translate it back to {noteIdx, octave} using
   the exact same layout the LED display uses, so pressing "C2" on the device
   plays/sends C at octave 2. Independent of the OCT dial (which only steers
   which band the app's own display layer highlights). */
const LP_PIANO_PAD_TO_NOTE = {};
const LP_PIANO_NOTE_TO_PADS = Array.from({ length: 12 }, () => []);
for (let lpBand = 0; lpBand < LP_BANDS; lpBand++) {
  for (let lpNoteIdx = 0; lpNoteIdx < 12; lpNoteIdx++) {
    for (const pad of padNotesForIndex(lpNoteIdx, lpBand)) {
      LP_PIANO_PAD_TO_NOTE[pad] = { noteIdx: lpNoteIdx, octave: lpBand + 1 }; // bands read bottom-to-top as octave 1–4
      LP_PIANO_NOTE_TO_PADS[lpNoteIdx].push(pad);
    }
  }
}

/* second selectable layout: "fretboard" — a guitar-like isomorphic grid where
   +1 column = +1 semitone and +1 row = +5 semitones (a perfect fourth, same
   interval as adjacent guitar strings). Unlike the piano layout's 4 stacked
   2-row bands, this uses the full 8 rows as one continuous run, so every one
   of the 64 pads is playable (no gap pads). */
const LP_FRETBOARD_ANCHOR = 0; // bottom-left pad (row 0, col 0) is C1, per the reference layout
const LP_FRETBOARD_PAD_TO_NOTE = {};
const LP_FRETBOARD_NOTE_TO_PADS = Array.from({ length: 12 }, () => []);
for (let row = 0; row < 8; row++) {
  for (let col = 0; col < 8; col++) {
    const pad      = 11 + col + 10 * row;
    const semitone = LP_FRETBOARD_ANCHOR + col + 5 * row;
    const noteIdx  = semitone % 12;
    const octave   = 1 + Math.floor(semitone / 12);
    LP_FRETBOARD_PAD_TO_NOTE[pad] = { noteIdx, octave };
    LP_FRETBOARD_NOTE_TO_PADS[noteIdx].push(pad);
  }
}

function lpPadToNote(pad) {
  return lpLayout === 'fretboard' ? LP_FRETBOARD_PAD_TO_NOTE[pad] : LP_PIANO_PAD_TO_NOTE[pad];
}

function lpNoteToPads(noteIdx) {
  return lpLayout === 'fretboard' ? LP_FRETBOARD_NOTE_TO_PADS[noteIdx] : LP_PIANO_NOTE_TO_PADS[noteIdx];
}

/* every pad in the active layout that represents this note — the display layer
   highlights a note everywhere it appears on the grid, not just one octave.
   Transpose shifts which physical pad-shape plays which note-class, so the
   pad(s) to light for a given noteIdx are found by looking up the shape that
   *would* produce noteIdx once transposed (the inverse of the input side). */
function allPadsForIndex(noteIdx) {
  const baseIdx = ((noteIdx - lpTranspose) % 12 + 12) % 12;
  return lpNoteToPads(baseIdx);
}

const LP_BLACK_NOTES = new Set([1, 3, 6, 8, 10]); // C#, D#, F#, G#, A#

/* C always gets the same light-blue idle backlight on both layouts, as a
   fixed visual anchor for "where the octave starts". The piano layout
   already distinguishes black/white keys by row position, so every other
   note just stays the plain dim color; the fretboard layout has no such
   positional cue, so its sharps also get color-coded (dimmed white).
   Returns [r,g,b]. */
function lpBacklightColorForNote(noteIdx) {
  if (noteIdx === 0) return LP_RGB_C_BLUE;
  if (lpLayout === 'fretboard' && LP_BLACK_NOTES.has(noteIdx)) return LP_RGB_DIM_WHITE;
  return LP_RGB_DIM;
}

/* a pad with its own hue (C's blue) stays that hue when pressed, just
   brighter — everything else (grey-family idle colors) just goes full white.
   Used only when the press came from the physical pad itself. */
function lpActiveColorForNote(noteIdx) {
  if (noteIdx === 0) return lightenColor(LP_RGB_C_BLUE, 0.55);
  return LP_RGB_ACTIVE;
}

/* paint every playable pad in the active layout with the idle backlight */
function paintLaunchpadBacklight(output) {
  // clear every one of the 64 grid pads first — the piano layout only uses
  // 52 of them, and whatever was lit before (the fretboard layout, which
  // uses all 64, a previous session, or the device's own standalone mode)
  // would otherwise stay lit on the ones the current layout leaves unused
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) setLaunchpadRGB(output, 11 + col + 10 * row, 0, 0, 0);
  }
  for (let noteIdx = 0; noteIdx < 12; noteIdx++) {
    const [r, g, b] = lpBacklightColorForNote(noteIdx);
    for (const pad of lpNoteToPads(noteIdx)) setLaunchpadRGB(output, pad, r, g, b);
  }
}

/* the two layout-picker side buttons: red for whichever is currently active */
function paintLaunchpadLayoutButtons(output) {
  const dim = [LP_ARROW_DIM, LP_ARROW_DIM, LP_ARROW_DIM];
  const [kr, kg, kb] = lpLayout === 'piano'     ? LP_RGB_APP_ACTIVE : dim;
  const [ur, ug, ub] = lpLayout === 'fretboard' ? LP_RGB_APP_ACTIVE : dim;
  setLaunchpadRGB(output, LP_CC_KEYS, kr, kg, kb);
  setLaunchpadRGB(output, LP_CC_USER, ur, ug, ub);
}

/* set one button's full RGB color (0-127 per channel) — the arrows aren't part
   of the 8x8 grid's simple palette-velocity scheme, so use Novation's RGB
   SysEx directly for a real gradient instead of picking from the 128-color
   palette. LED = the button's own CC/note number. */
function setLaunchpadRGB(output, led, r, g, b) {
  if (midiMonitorEnabled) console.log('[MIDI out] light up', led, 'rgb', r, g, b);
  output.send([0xF0, 0x00, 0x20, 0x29, 0x02, LP_DEVICE_ID, 0x03, 0x03, led, r, g, b, 0xF7]);
}

/* each arrow lights up on its OWN — dim neutral at rest, then red in
   proportion to how many steps have been taken in *that* arrow's own
   direction. The opposite arrow of the pair stays dim regardless (e.g.
   pressing Left twice reddens only Left; Right is untouched), so the two
   arrows of a pair are independent indicators rather than a single shared
   position readout. */
const LP_ARROW_DIM   = 25; // dimmed neutral color at rest / wrong-direction
const LP_ARROW_STEPS = 3;  // reach full saturation within this many steps — or at the
                            // real limit, whichever is closer — so each press is a big, obvious jump

function arrowDirectionColor(steps, maxSteps) {
  if (steps <= 0) return { r: LP_ARROW_DIM, g: LP_ARROW_DIM, b: LP_ARROW_DIM };
  const saturateAt = Math.min(maxSteps, LP_ARROW_STEPS);
  const fade = Math.round(LP_ARROW_DIM * (1 - Math.min(1, steps / saturateAt)));
  return { r: 127, g: fade, b: fade };
}

function paintLaunchpadArrows(output) {
  if (!output) return;
  const up    = arrowDirectionColor(Math.max(0,  lpOctaveShift), LP_OCTAVE_SHIFT_MAX);
  const down  = arrowDirectionColor(Math.max(0, -lpOctaveShift), -LP_OCTAVE_SHIFT_MIN);
  const left  = arrowDirectionColor(Math.max(0, -lpTranspose),   -LP_TRANSPOSE_MIN);
  const right = arrowDirectionColor(Math.max(0,  lpTranspose),   LP_TRANSPOSE_MAX);
  setLaunchpadRGB(output, LP_CC_UP,    up.r, up.g, up.b);
  setLaunchpadRGB(output, LP_CC_DOWN,  down.r, down.g, down.b);
  setLaunchpadRGB(output, LP_CC_LEFT,  left.r, left.g, left.b);
  setLaunchpadRGB(output, LP_CC_RIGHT, right.r, right.g, right.b);
}

function setLaunchpadProgrammerMode(output, on) {
  if (!output) return;
  output.send([0xF0, 0x00, 0x20, 0x29, 0x02, LP_DEVICE_ID, 0x0E, on ? 0x01 : 0x00, 0xF7]);
  if (on) { paintLaunchpadBacklight(output); paintLaunchpadArrows(output); paintLaunchpadLayoutButtons(output); paintLaunchpadWaveButtons(output); }
}

/* source: 'app' (mic, on-screen keys, keyboard shortcuts, chroma test — always
   red) vs 'pad' (physically pressing the Launchpad's own pad — white, or a
   brightened version of the note's own hue; its own LED feedback is handled
   directly by onLaunchpadPadMessage/paintPressedPad, not here). octave: the
   exact octave this 'app' note-on was detected/played at, if known — used
   only for the optional full-range-detection purple highlight. */
function sendMidiNote(noteIdx, on, source = 'app', octave = null) {
  if (!midiOut) return;
  if (launchpadProgrammerMode) {
    if (source === 'app') {
      if (on) {
        lpNotePlaying[noteIdx]    = true; // pins brightness at full — see applyDecayTick()
        lpNoteBrightness[noteIdx] = 1;
        if (octave !== null) lpNoteOctave[noteIdx] = octave; else delete lpNoteOctave[noteIdx];
        paintLaunchpadNoteFade(noteIdx);
      } else {
        lpNotePlaying[noteIdx] = false; // no longer held — starts fading on the next decay tick
      }
    }
  } else if (launchkeyDawMode) {
    if (source === 'app') paintLaunchkeyNote(noteIdx, on);
  } else {
    const ch = midiOutChannel === 'omni' ? 0 : midiOutChannel;
    midiOut.send([(on ? 0x90 : 0x80) | ch, midiNoteNum(noteIdx), on ? 100 : 0]);
  }
}

/* the physical pad's own LED. heldNoteCount (used by onNoteOn/onNoteOff to
   gate audio/bar-timing/MIDI-echo per chroma, not per octave) would hide a
   second simultaneous press of the same note class at another octave, so
   this is driven straight from the raw incoming pad message instead — every
   press/release of a given physical pad always repaints that exact pad.
   Piano layout: only the pressed pad itself lights up (each pad is its own
   independent light). Fretboard layout: keeps the existing behavior of
   highlighting every pad sharing this chroma.
   baseIdx: the pad's own fixed (pre-transpose) identity — used for color, so
   a pad's own hue/dim-vs-white status never depends on the current
   transpose. displayedNoteIdx: the chroma this press actually sounds (post-
   transpose) — used only to find sibling pads on the fretboard layout. */
function paintPressedPad(pad, baseIdx, displayedNoteIdx, on) {
  if (!midiOut || !launchpadProgrammerMode || !lpLightPressedPads) return;
  const [r, g, b] = on ? lpActiveColorForNote(baseIdx) : lpBacklightColorForNote(baseIdx);
  const pads = lpLayout === 'piano' ? [pad] : allPadsForIndex(displayedNoteIdx);
  pads.forEach(p => setLaunchpadRGB(midiOut, p, r, g, b));
}

/* two independent layers share the same physical grid: the LED side (above)
   just displays whatever the app already knows about; this is the other
   layer — physically pressing a pad is real input, decoded back through the
   identical layout so it plays the exact note/octave the pad is labelled. */
function onLaunchpadPadMessage(status, pad, velocity) {
  const cmd  = status & 0xF0;
  const info = lpPadToNote(pad);
  if (!info) return; // an unmapped/gap pad — ignore
  // apply the current transpose/octave-shift, carrying any semitone overflow into the octave
  let noteIdx = info.noteIdx + lpTranspose;
  let octave  = info.octave + lpOctaveShift + Math.floor(noteIdx / 12);
  noteIdx     = ((noteIdx % 12) + 12) % 12;
  const el = keyEls[noteIdx];
  const isOn  = cmd === 0x90 && velocity > 0;
  const isOff = cmd === 0x80 || (cmd === 0x90 && velocity === 0);
  if (isOn)  onNoteOn(noteIdx, el, false, octave, 'pad');
  if (isOff) onNoteOff(noteIdx, el, false, octave, 'pad');
  if (isOn || isOff) paintPressedPad(pad, info.noteIdx, noteIdx, isOn);
}

/* arrow buttons only act on press (CC value > 0), never on release */
function onLaunchpadArrowMessage(cc, value) {
  if (value === 0) return;
  if      (cc === LP_CC_UP)    lpOctaveShift = Math.min(LP_OCTAVE_SHIFT_MAX, lpOctaveShift + 1);
  else if (cc === LP_CC_DOWN)  lpOctaveShift = Math.max(LP_OCTAVE_SHIFT_MIN, lpOctaveShift - 1);
  else if (cc === LP_CC_LEFT)  lpTranspose   = Math.max(LP_TRANSPOSE_MIN, lpTranspose - 1);
  else if (cc === LP_CC_RIGHT) lpTranspose   = Math.min(LP_TRANSPOSE_MAX, lpTranspose + 1);
  else return;
  if (midiOut && launchpadProgrammerMode) paintLaunchpadArrows(midiOut);
}

/* Keys/User (top row) pick the active layout — press only, ignore an
   already-active pick */
function onLaunchpadLayoutButtonMessage(cc, value) {
  if (value === 0) return;
  const newLayout = cc === LP_CC_KEYS ? 'piano' : cc === LP_CC_USER ? 'fretboard' : null;
  if (!newLayout || newLayout === lpLayout) return;
  lpLayout = newLayout;
  if (midiOut && launchpadProgrammerMode) {
    paintLaunchpadBacklight(midiOut);       // the set of playable pads/notes changed
    paintLaunchpadLayoutButtons(midiOut);   // move the indicator
  }
}

function onMidiMessage(e) {
  const [status, data1, data2] = e.data;
  if (midiMonitorEnabled) console.log('[MIDI in]', status.toString(16), data1, data2);
  if (launchpadInputMode) {
    const cmd = status & 0xF0;
    if (cmd === 0xB0) {
      if (data1 === LP_CC_KEYS || data1 === LP_CC_USER) { onLaunchpadLayoutButtonMessage(data1, data2); return; }
      if (LP_CC_STOP_SOLO_MUTE.includes(data1)) { if (data2 > 0) reset(); return; } // side-column "Stop Solo Mute" — same as clicking the app title
      const waveIdx = LP_CC_WAVE.indexOf(data1);
      if (waveIdx !== -1) { if (data2 > 0) setWaveType(LP_WAVE_ORDER[waveIdx]); return; } // rest of the side column — pick a waveform
      onLaunchpadArrowMessage(data1, data2);
      return;
    }
    onLaunchpadPadMessage(status, data1, data2);
    return;
  }

  const cmd = status & 0xF0;
  const ch  = status & 0x0F;
  if (midiInChannel !== 'omni' && ch !== midiInChannel) return; // Settings > MIDI in channel
  const noteIdx = data1 % 12;
  const el      = keyEls[noteIdx];
  if (!el) return;
  if (cmd === 0x90 && data2 > 0) onNoteOn(noteIdx, el, true);
  else if (cmd === 0x80 || (cmd === 0x90 && data2 === 0)) onNoteOff(noteIdx, el, true);
}

/* ── LAUNCHKEY (MK3 & MK4) — DAW-mode pad lighting, output only ──────────
   Launchkey exposes the pad grid for lighting only through its dedicated
   "DAW" MIDI port (not the plain performance port — on some systems this
   may only be the *second* MIDI device the Launchkey exposes; if you only
   see one "...MIDI Out" and no "...DAW Out" in the Settings > MIDI out
   list, the DAW port likely isn't the one selected there), and only once
   DAW mode is switched on. Unlike Launchpad there's no pad-press *input*
   handling here: this only lights pads to show which notes are currently
   sounding (mic-detected or played in-app).

   DAW-mode-enable, the pad note numbers, and the colouring scheme below
   are all identical between the MK3 and MK4 Programmer's Reference
   Guides, so this same code targets both without needing to tell them
   apart. Session/DAW mode's 2x8 pad grid (top row note 60h/96–67h/103,
   bottom row 70h/112–77h/119) is mapped to one octave the same way
   Launchpad's piano layout maps a 2-row band: bottom row = white keys,
   top row = black keys, gapped at E–F/B–C, C duplicated at both ends of
   the bottom row. */
let launchkeyDawMode = false; // true once the connected device has been switched into DAW mode
const LK_COLOR_OFF    = 0;  // palette index — LED off
const LK_COLOR_DIM    = 1;  // idle backlight, regular notes (dark grey)
const LK_COLOR_C_BLUE = 45; // idle backlight, every C (blue)
const LK_COLOR_ACTIVE = 5;  // currently sounding, app-triggered (red)

const LK_NOTE_PAD = [
  [112, 119], // C (+ duplicate at the far end of the row, like Launchpad)
  [97],  // C#
  [113], // D
  [98],  // D#
  [114], // E
  [115], // F
  [100], // F#
  [116], // G
  [101], // G#
  [117], // A
  [102], // A#
  [118], // B
];
const LK_UNUSED_PADS = [96, 99, 103]; // top-row gaps at E–F/B–C — no black key there

function setLaunchkeyPad(output, pad, colorIndex) {
  output.send([0x90, pad, colorIndex]); // Note On, channel 1 = stationary colour
}

function lkColorForNote(noteIdx) {
  return noteIdx === 0 ? LK_COLOR_C_BLUE : LK_COLOR_DIM;
}

function paintLaunchkeyBacklight(output) {
  for (let i = 0; i < 12; i++) LK_NOTE_PAD[i].forEach(pad => setLaunchkeyPad(output, pad, lkColorForNote(i)));
  LK_UNUSED_PADS.forEach(pad => setLaunchkeyPad(output, pad, LK_COLOR_OFF));
}

/* the only per-note entry point — see sendMidiNote()'s launchkeyDawMode branch */
function paintLaunchkeyNote(noteIdx, active) {
  if (!midiOut || !launchkeyDawMode) return;
  const color = active ? LK_COLOR_ACTIVE : lkColorForNote(noteIdx);
  LK_NOTE_PAD[noteIdx].forEach(pad => setLaunchkeyPad(midiOut, pad, color));
}

function setLaunchkeyDawMode(output, on) {
  if (!output) return;
  output.send([0x9F, 0x0C, on ? 0x7F : 0x00]); // channel 16, note 0Ch (12) = DAW mode on/off
  // Entering DAW mode defaults the pads to Session/DAW layout on its own —
  // confirmed identical (96-103 top row, 112-119 bottom row, same colouring
  // scheme) across both the MK3 and MK4 Programmer's Reference Guides, so
  // no separate pad-mode-select message is needed (and MK3 vs MK4 actually
  // use a *different* channel/CC for that, so sending the wrong one for
  // whichever's connected would be worse than not sending it at all).
  if (on) paintLaunchkeyBacklight(output);
}

let launchpadInputMode = false; // true when the selected MIDI-in device is also a Launchpad

function setMidiIn(id) {
  if (midiIn) { midiIn.onmidimessage = null; }
  midiIn = (id && midiAccess) ? midiAccess.inputs.get(id) || null : null;
  if (midiIn) midiIn.onmidimessage = onMidiMessage;
  launchpadInputMode = !!(midiIn && /launchpad/i.test(midiIn.name || ''));
  updateMidiDot();
}

function setMidiOut(id) {
  const newOut = (id && midiAccess) ? midiAccess.outputs.get(id) || null : null;
  if (midiOut && midiOut !== newOut && launchpadProgrammerMode) {
    setLaunchpadProgrammerMode(midiOut, false); // hand the old device back to normal standalone use
  }
  if (midiOut && midiOut !== newOut && launchkeyDawMode) {
    setLaunchkeyDawMode(midiOut, false); // hand the old device back to Standalone (MIDI) mode
  }
  midiOut = newOut;
  launchpadProgrammerMode = !!(midiOut && /launchpad/i.test(midiOut.name || ''));
  launchkeyDawMode        = !!(midiOut && /launchkey/i.test(midiOut.name || ''));
  if (launchpadProgrammerMode) {
    for (const k in lpNoteBrightness) delete lpNoteBrightness[k]; // no stale fade state from a previous connection
    for (const k in lpNotePlaying)    delete lpNotePlaying[k];
    for (const k in lpNoteOctave)     delete lpNoteOctave[k];
    setLaunchpadProgrammerMode(midiOut, true);
  }
  if (launchkeyDawMode) setLaunchkeyDawMode(midiOut, true);
  updateMidiDot();
}

function updateMidiDot() {
  const dot = document.getElementById('midi-dot');
  if (dot) dot.className = 'mdot' + (midiIn || midiOut ? ' on' : '');
}

function refreshMidiDevices() {
  if (!midiAccess) return;
  const inSel  = document.getElementById('midi-in-select');
  const outSel = document.getElementById('midi-out-select');
  const msg    = document.getElementById('midi-status-msg');
  if (!inSel) return;

  const prevIn  = inSel.value;
  const prevOut = outSel.value;

  inSel.innerHTML  = '<option value="">— None —</option>';
  outSel.innerHTML = '<option value="">— None —</option>';

  midiAccess.inputs.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    inSel.appendChild(o);
  });
  midiAccess.outputs.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    outSel.appendChild(o);
  });

  const prefs = loadDevicePrefs();
  inSel.value  = restoreDeviceValue(inSel,  prevIn,  prefs.midiIn);
  outSel.value = restoreDeviceValue(outSel, prevOut, prefs.midiOut);
  setMidiIn(inSel.value);
  setMidiOut(outSel.value);

  const nI = midiAccess.inputs.size, nO = midiAccess.outputs.size;
  if (msg) {
    msg.textContent = (nI + nO) > 0
      ? `${nI} input${nI !== 1 ? 's' : ''}, ${nO} output${nO !== 1 ? 's' : ''} detected`
      : 'No MIDI devices found';
    msg.className = 'sp-status' + ((nI + nO) > 0 ? ' ok' : '');
  }
}

async function initMidi() {
  const msg = document.getElementById('midi-status-msg');
  const dot = document.getElementById('midi-dot');
  if (!navigator.requestMIDIAccess) {
    if (msg) { msg.textContent = 'Web MIDI not supported in this browser.'; msg.className = 'sp-status err'; }
    if (dot) dot.className = 'mdot err';
    return;
  }
  try {
    midiAccess = await navigator.requestMIDIAccess({ sysex: true }); // needed to switch the Launchpad into Programmer Mode
    midiAccess.onstatechange = refreshMidiDevices;
    refreshMidiDevices();
  } catch (err) {
    if (msg) { msg.textContent = 'MIDI access denied.'; msg.className = 'sp-status err'; }
    if (dot) dot.className = 'mdot err';
  }
}

/* asks for MIDI access at most once, whatever triggers it first */
function ensureMidiAccess() {
  if (midiRequested) return;
  midiRequested = true;
  initMidi();
}

/* Browsers give no way to detect connected MIDI hardware without first
   asking for permission, so we can't gate the prompt on "a device is
   plugged in" directly. The next best thing: never ask on page load —
   only silently reuse a permission already granted in an earlier visit
   (no popup for that), and otherwise wait for the user to open Settings,
   which is the one action that actually signals they want to use MIDI. */
async function tryAutoMidi() {
  if (!navigator.permissions?.query) return;
  try {
    const status = await navigator.permissions.query({ name: 'midi', sysex: true });
    if (status.state === 'granted') ensureMidiAccess();
  } catch (e) { /* 'midi' permission name unsupported in this browser */ }
}

/* ═══════════════════════════════════════
   SETTINGS PANEL
═══════════════════════════════════════ */
function initSettings() {
  const btn      = document.getElementById('settings-btn');
  const panel    = document.getElementById('settings-panel');
  const header   = document.querySelector('.sp-header');

  function openPanel()  {
    panel.classList.add('open');
    btn.classList.add('active');
    ensureMidiAccess();   // ask for MIDI access here, not on page load
    ensureAudioDevices(); // same for audio in/out device labels
  }
  function closePanel() {
    panel.classList.remove('open');
    btn.classList.remove('active');
  }

  btn.addEventListener('click', () =>
    panel.classList.contains('open') ? closePanel() : openPanel()
  );
  header.addEventListener('click', closePanel); // whole header closes — the ✕ inside it is just a visual affordance

  document.getElementById('midi-in-select').addEventListener('change', e => {
    setMidiIn(e.target.value);
    saveDevicePref('midiIn', e.target.value, e.target.selectedOptions[0]?.textContent || '');
  });
  document.getElementById('midi-out-select').addEventListener('change', e => {
    setMidiOut(e.target.value);
    saveDevicePref('midiOut', e.target.value, e.target.selectedOptions[0]?.textContent || '');
  });

  document.getElementById('audio-in-select').addEventListener('change', e => {
    setAudioIn(e.target.value);
    saveDevicePref('audioIn', e.target.value, e.target.selectedOptions[0]?.textContent || '');
  });
  document.getElementById('audio-out-select').addEventListener('change', e => {
    setAudioOut(e.target.value);
    saveDevicePref('audioOut', e.target.value, e.target.selectedOptions[0]?.textContent || '');
  });

  document.getElementById('wave-select').addEventListener('change', e => { setWaveType(e.target.value); });

  document.getElementById('press-states-select').addEventListener('change', e => {
    lpLightPressedPads = e.target.value === 'yes';
  });

  document.getElementById('detection-select').addEventListener('change', e => {
    lpFullRangeDetection = e.target.value === 'full';
  });

  document.getElementById('midi-monitor-select').addEventListener('change', e => {
    midiMonitorEnabled = e.target.value === 'yes';
  });

  document.getElementById('pitch-algo-select').addEventListener('change', e => {
    setPitchAlgo(e.target.value);
  });
  document.getElementById('algo-panel-select').addEventListener('change', e => {
    setPitchAlgo(e.target.value);
  });

  document.getElementById('decay-select').addEventListener('change', e => {
    setDecayPct(parseInt(e.target.value, 10));
  });

  document.getElementById('mic-onoff-select').addEventListener('change', e => {
    setMode(e.target.value === 'on' ? 'outside' : 'inner');
  });

  document.getElementById('sound-oct-select').addEventListener('change', e => {
    previewOctave = parseInt(e.target.value, 10);
  });

  document.getElementById('gain-db-select').addEventListener('change', e => {
    setMicGain(parseInt(e.target.value, 10));
  });

  document.getElementById('midi-in-channel-select').addEventListener('change', e => {
    midiInChannel = e.target.value === 'omni' ? 'omni' : parseInt(e.target.value, 10);
  });
  document.getElementById('midi-out-channel-select').addEventListener('change', e => {
    midiOutChannel = e.target.value === 'omni' ? 'omni' : parseInt(e.target.value, 10);
  });
  document.getElementById('midi-transpose-select').addEventListener('change', e => {
    shiftMidiOctave(parseInt(e.target.value, 10) - (midiOctave - 4));
  });
}

function build() {
  const barArea  = document.getElementById('bar-area');
  const keyboard = document.getElementById('keyboard');

  /* bars — white first (z:1) then black overlaid (z:2) */
  WHITE_KEYS.forEach(k => barArea.appendChild(makeBarCol(k.noteIdx, 'white')));
  BLACK_KEYS.forEach(k => barArea.appendChild(makeBarCol(k.noteIdx, 'black')));

  /* keys — white first, black on top */
  WHITE_KEYS.forEach(k => keyboard.appendChild(makeKey(k, 'white')));
  BLACK_KEYS.forEach(k => keyboard.appendChild(makeKey(k, 'black')));

  initResize();
  initSettings();
  tryAutoMidi();
  initScrubDrag('decay-ctrl', () => decayPct, setDecayPct);
  initScrubDrag('gain-ctrl', () => micGainDb, setMicGain, 0.25);
  setDecayPct(decayPct); // starts the decay interval for the default rate
  applyLayout();

  document.getElementById('mic-badge').addEventListener('click', () =>
    setMode(mode === 'outside' ? 'inner' : 'outside')
  );
  document.getElementById('app-title').addEventListener('click', reset);
  window.addEventListener('resize', applyLayout);

  /* #keyboard's width also changes when the settings panel slides in/out
     (it pushes #app via flex rather than overlaying it) — a window resize
     alone wouldn't catch that, so re-run the layout on every frame of the
     transition too, making the keys/bars visibly stretch along with it. */
  new ResizeObserver(applyLayout).observe(document.getElementById('keyboard'));

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    const key = e.key.toLowerCase();
    if (key === 'z') { shiftPreviewOctave(-1); return; }
    if (key === 'x') { shiftPreviewOctave(1);  return; }
    if (key === 'arrowup' || key === 'arrowdown') {
      // don't hijack native arrow-key behavior on an actually-focused control
      const el = document.activeElement;
      const isFormControl = el && (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.isContentEditable);
      if (!isFormControl) { cyclePitchAlgo(key === 'arrowdown' ? 1 : -1); return; }
    }
    const idx = KEY_MAP[key];
    if (idx === undefined) return;
    e.preventDefault();
    if (heldKeys.has(key)) return;
    heldKeys.add(key);
    const el = keyEls[idx];
    if (el) onNoteOn(idx, el, false, previewOctave);
  });

  document.addEventListener('keyup', e => {
    const key = e.key.toLowerCase();
    const idx = KEY_MAP[key];
    heldKeys.delete(key);
    if (idx !== undefined) {
      const el = keyEls[idx];
      if (el) onNoteOff(idx, el, false, previewOctave);
    }
  });

  /* release any mouse-held note when button is lifted anywhere on page */
  document.addEventListener('mouseup', () => {
    keyEls.forEach((el, idx) => {
      if (el && el.classList.contains('pressed')) onNoteOff(idx, el, false, previewOctave);
    });
  });
}

build();
</script>
</body>
